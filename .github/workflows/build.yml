name: Build QEMU-iOS on macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-qemu-ios:
    runs-on: macos-13
    steps:
      # 1. Checkout the repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Install dependencies via Homebrew
      - name: Install dependencies
        run: |
          brew update
          brew install glib ninja pixman pkg-config sdl2 openssl@3

      # 3. Clone the qemu-ios repository
      - name: Clone qemu-ios
        run: |
          git clone https://github.com/devos50/qemu-ios.git
          cd qemu-ios
          mkdir build
          cd build
          ../configure --target-list=arm-softmmu \
                       --extra-cflags=-I/usr/local/opt/openssl@3/include \
                       --extra-ldflags='-L/usr/local/opt/openssl@3/lib -lcrypto'
          make -j32

      # 4. Upload qemu-ios folder as an artifact
      - name: Upload qemu-ios build
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ios-build
          path: qemu-ios
